name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    name: Test (macOS, Swift 6)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict concurrency build
        run: swift build -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete

  apple-sdks:
    name: Apple SDKs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for Apple platforms
        run: |
          set -euo pipefail
          for destination in \
            "generic/platform=macOS" \
            "generic/platform=iOS" \
            "generic/platform=tvOS" \
            "generic/platform=watchOS" \
            "generic/platform=visionOS" \
            "generic/platform=macOS,variant=Mac Catalyst"
          do
            xcodebuild \
              -scheme ColorfulSwift \
              -destination "$destination" \
              -skipMacroValidation \
              -skipPackagePluginValidation \
              CODE_SIGNING_ALLOWED=NO \
              build
          done

  test-linux:
    name: Test (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2-jammy", "6.4-jammy"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Strict concurrency build
        run: swift build -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete

  test-windows:
    name: Test (Windows, Swift 6.2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE
      - name: Strict concurrency build
        run: swift build -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test -Xswiftc -warnings-as-errors -Xswiftc -strict-concurrency=complete

  release:
    name: GitHub Release
    needs: [test-macos, apple-sdks, test-linux, test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
